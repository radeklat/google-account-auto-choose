<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Restore Backup - Google Account Auto-Chooser</title>
  <style>
    body {
      max-width: 720px;
      margin: 24px auto;
      padding: 0 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #222;
    }
    h2 {
      margin: 0 0 12px 0;
      color: #1a73e8;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      background: #f8f9fa;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .secondary-btn {
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
    }
    .secondary-btn:hover {
      background: #5a6268;
    }
    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #333;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h2>Restore Backup</h2>
  <div class="card">
    <div>Choose a JSON backup file to restore. This will replace your current settings and rules.</div>
    <div class="row">
      <input id="restore-file" type="file" accept="application/json,.json">
      <button id="close-btn" class="secondary-btn" type="button">Close</button>
    </div>
    <div class="hint">Tip: Use the Backup button in the popup to create a compatible file.</div>
    <div id="status"></div>
  </div>

  <script src="restore.js"></script>
</body>
</html>
